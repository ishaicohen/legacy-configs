      - 'STATS_GATHER_FEATURES=true'
      - 'STATS_SUBMIT=true'
      - 'STATS_AUTO_CONFIG_6=legacy3'
      - 'PASSWORD=${GOYPASSWORD}'
      - 'RCONPASSWORD=${GOYRCONPASSWORD}'
      - 'REFPASSWORD=${GOYREFPASSWORD}'
      - 'MAP_PORT=27971'
    volumes:
      - ./maps:/maps
